<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Block Tower Stack</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game-container">
      <div id="score-panel">
        <div class="score-item">
          <div class="score-label">Score</div>
          <div class="score-value" id="score-value">0</div>
          <div class="combo" id="combo-value"></div>
        </div>
        <div class="score-item center">
          <div class="score-label">Blocks</div>
          <div class="score-value" id="block-count">0</div>
        </div>
        <div class="score-item">
          <div class="score-label">High Score</div>
          <div class="score-value" id="high-score-value">0</div>
        </div>
      </div>
      <canvas id="game-canvas"></canvas>
      <div id="instructions">
        🎯 Stack blocks in the center! Fallen blocks auto-remove. Keep playing
        forever!
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="game.js"></script>
  </body>
</html>
